name: S&P 500 Tech-Scan

on:
  schedule:
    # GitHub rechnet Cron in UTC: 03:00 UTC = 04:00 MEZ (Winterzeit).
    # In der Sommerzeit (MESZ) läuft der Job damit um 05:00 Ortszeit.
    - cron: "0 4 * * *"
  workflow_dispatch: # manueller Start über "Run workflow"

permissions:
  contents: write # nötig, um data.json zurück ins Repo zu committen

concurrency:
  group: sp500-tech-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: req.txt

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r req.txt

      - name: Tech-Scan ausführen
        run: python sp500_tech_scan.py --quiet --out data.json

      - name: data.json committen
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an data.json."
          else
            git commit -m "data.json aktualisiert ($(date -u +'%Y-%m-%d'))"
            git push
          fi
