name: S&P 500 Tech-Scan

on:
  schedule:
    # GitHub rechnet Cron in UTC: 04:00 UTC = 05:00 MEZ (Winterzeit).
    # In der Sommerzeit (MESZ) läuft der Job damit um 06:00 Ortszeit.
    - cron: "0 4 * * *"
  workflow_dispatch: # manueller Start über "Run workflow"

permissions:
  contents: write # nötig, um data.json zurück ins Repo zu committen

concurrency:
  group: sp500-tech-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: req.txt

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r req.txt

      - name: Tech-Scan ausführen
        run: python sp500_tech_scan.py --quiet --out data.json

      - name: data.json committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an data.json."
          else
            git commit -m "data.json aktualisiert ($(date -u +'%Y-%m-%d'))"
            # Hat sich main während des Laufs geändert (z.B. Edit im Browser),
            # erst den neuen Stand holen und den Commit daraufsetzen.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push fehlgeschlagen (Versuch $i), neuer Versuch in 10 s ..."
              sleep 10
            done
            exit 1
          fi
